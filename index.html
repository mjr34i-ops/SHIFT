<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフトカレンダー登録アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .shift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .inter-font { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 inter-font">
    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">Shift to Calendar</h1>
            <p class="text-slate-600">勤務パターンをGoogleカレンダーへ一括登録</p>
        </header>

        <!-- 設定セクション -->
        <div id="setup-section" class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <span class="mr-2">⚙️</span> 初期設定
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Google Client ID</label>
                    <input type="text" id="client-id" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="xxxx.apps.googleusercontent.com">
                </div>
                <div class="flex items-end">
                    <button id="auth-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors w-full">
                        Google連携を開始
                    </button>
                </div>
            </div>
        </div>

        <!-- シフトパターン登録セクション -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <span class="mr-2">📋</span> シフトパターンの登録
            </h2>
            
            <div class="mb-4">
                <div class="flex border-b overflow-x-auto">
                    <button onclick="switchPattern(0)" id="tab-0" class="px-6 py-2 font-medium border-b-2 border-blue-600 text-blue-600 whitespace-nowrap">1組</button>
                    <button onclick="switchPattern(1)" id="tab-1" class="px-6 py-2 font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">2組</button>
                    <button onclick="switchPattern(2)" id="tab-2" class="px-6 py-2 font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">3組</button>
                    <button onclick="switchPattern(3)" id="tab-3" class="px-6 py-2 font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">4組</button>
                </div>
            </div>

            <div id="pattern-editor">
                <div class="mb-4 flex items-center gap-4">
                    <label class="text-sm font-medium">パターン期間:</label>
                    <select id="pattern-length" onchange="handleLengthChange()" class="p-1 border rounded">
                        <option value="16">16日間</option>
                        <option value="17">17日間</option>
                        <option value="18">18日間</option>
                        <option value="19">19日間</option>
                        <option value="20">20日間</option>
                    </select>
                </div>
                <div id="shift-inputs" class="shift-grid mb-6"></div>
                <button onclick="saveCurrentPattern()" class="bg-slate-800 hover:bg-slate-900 text-white py-2 px-4 rounded text-sm transition-colors">
                    このパターンを保存
                </button>
            </div>
        </div>

        <!-- 登録実行セクション -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <span class="mr-2">🚀</span> カレンダーへ登録実行
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">開始日</label>
                    <input type="date" id="start-date" class="w-full p-2 border rounded shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">使用するパターン</label>
                    <select id="select-pattern" onchange="updateOffsetRange()" class="w-full p-2 border rounded bg-white shadow-sm">
                        <option value="0">1組</option>
                        <option value="1">2組</option>
                        <option value="2">3組</option>
                        <option value="3">4組</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">開始日のシフト位置</label>
                    <select id="pattern-offset" class="w-full p-2 border rounded bg-white shadow-sm"></select>
                </div>
                <button id="execute-btn" disabled class="bg-green-600 hover:bg-green-700 disabled:bg-slate-300 text-white font-bold py-2 px-6 rounded shadow transition-all transform active:scale-95">
                    カレンダーに書き込む
                </button>
            </div>

            <div class="space-y-4 border-t pt-4">
                <div class="flex items-center space-x-3">
                    <span class="text-sm font-medium text-slate-700">登録モード:</span>
                    <label class="flex items-center space-x-2 cursor-pointer text-sm">
                        <input type="radio" name="range-mode" value="single" checked class="text-blue-600">
                        <span>パターンの1周期分のみ</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer text-sm font-bold text-blue-700">
                        <input type="radio" name="range-mode" value="until-end" class="text-blue-600">
                        <span>月末まで繰り返し登録する 🔄</span>
                    </label>
                </div>
                <p class="text-xs text-slate-500 ml-4">※「月末まで」を選ぶと、指定した開始日からその月の最後の日まで、パターンをループさせて予定を埋めます。</p>
            </div>

            <div id="status-message" class="mt-6 p-4 rounded-lg hidden text-sm font-medium border"></div>
        </div>
    </div>

    <script>
        let currentPatternIdx = 0;
        const createEmptyPattern = () => ({ length: 16, shifts: Array(20).fill('') });
        
        let patterns = JSON.parse(localStorage.getItem('shift_patterns')) || [
            createEmptyPattern(), createEmptyPattern(), createEmptyPattern(), createEmptyPattern()
        ];
        
        let tokenClient;
        let accessToken = null;

        window.onload = () => {
            const savedId = localStorage.getItem('google_client_id');
            if (savedId) document.getElementById('client-id').value = savedId;
            updateGrid();
            updateOffsetRange();
            document.getElementById('auth-btn').onclick = handleAuthClick;
            document.getElementById('execute-btn').onclick = executeSync;
        };

        function switchPattern(idx) {
            cacheCurrentInputs();
            currentPatternIdx = idx;
            document.querySelectorAll('[id^="tab-"]').forEach((tab, i) => {
                tab.classList.toggle('border-blue-600', i === idx);
                tab.classList.toggle('text-blue-600', i === idx);
                tab.classList.toggle('border-transparent', i !== idx);
                tab.classList.toggle('text-slate-500', i !== idx);
            });
            document.getElementById('pattern-length').value = patterns[idx].length;
            updateGrid();
            updateOffsetRange();
        }

        function handleLengthChange() {
            const length = parseInt(document.getElementById('pattern-length').value);
            patterns[currentPatternIdx].length = length;
            updateGrid();
            updateOffsetRange();
        }

        function updateOffsetRange() {
            const patternIdx = document.getElementById('select-pattern').value;
            const length = patterns[patternIdx].length;
            const offsetSelect = document.getElementById('pattern-offset');
            offsetSelect.innerHTML = '';
            for (let i = 1; i <= length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}日目のシフト`;
                offsetSelect.appendChild(opt);
            }
        }

        function cacheCurrentInputs() {
            const inputs = document.querySelectorAll('.shift-input');
            inputs.forEach(input => {
                const idx = parseInt(input.dataset.index);
                patterns[currentPatternIdx].shifts[idx] = input.value;
            });
        }

        function updateGrid() {
            const length = patterns[currentPatternIdx].length;
            const container = document.getElementById('shift-inputs');
            container.innerHTML = '';
            for (let i = 0; i < length; i++) {
                const val = patterns[currentPatternIdx].shifts[i] || '';
                const div = document.createElement('div');
                div.className = 'flex flex-col border p-2 rounded bg-slate-50 shadow-sm';
                div.innerHTML = `
                    <span class="text-xs font-bold text-slate-400 mb-1">${i + 1}日目</span>
                    <input type="text" class="shift-input p-1 text-sm border rounded outline-none" 
                           placeholder="例: 早番" value="${val}" data-index="${i}">
                `;
                container.appendChild(div);
            }
        }

        function saveCurrentPattern() {
            cacheCurrentInputs();
            localStorage.setItem('shift_patterns', JSON.stringify(patterns));
            showMessage('全パターンの内容を保存しました。', 'success');
        }

        function handleAuthClick() {
            const clientId = document.getElementById('client-id').value;
            if (!clientId) { showMessage('Client IDを入力してください。', 'error'); return; }
            localStorage.setItem('google_client_id', clientId);
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://www.googleapis.com/auth/calendar.events',
                callback: (response) => {
                    if (response.error) { showMessage('認証エラー: ' + response.error, 'error'); return; }
                    accessToken = response.access_token;
                    document.getElementById('execute-btn').disabled = false;
                    document.getElementById('auth-btn').innerText = '連携中 (Ready)';
                    document.getElementById('auth-btn').classList.replace('bg-blue-600', 'bg-green-600');
                    showMessage('Google連携に成功しました。', 'success');
                },
            });
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        async function executeSync() {
            const startDateStr = document.getElementById('start-date').value;
            if (!startDateStr) { showMessage('開始日を選択してください。', 'error'); return; }

            cacheCurrentInputs();
            const patternIdx = document.getElementById('select-pattern').value;
            const pattern = patterns[patternIdx];
            const startOffset = parseInt(document.getElementById('pattern-offset').value) - 1; 
            const startDate = new Date(startDateStr);
            const startMonth = startDate.getMonth();
            const rangeMode = document.querySelector('input[name="range-mode"]:checked').value;

            document.getElementById('execute-btn').disabled = true;
            document.getElementById('execute-btn').innerText = '登録中...';

            let count = 0;
            let i = 0;
            try {
                while (true) {
                    const targetDate = new Date(startDate);
                    targetDate.setDate(startDate.getDate() + i);

                    // 1周期モードの場合、パターンの長さに達したら終了
                    if (rangeMode === 'single' && i >= pattern.length) break;
                    // 月末までモードの場合、月が変わったら終了
                    if (rangeMode === 'until-end' && targetDate.getMonth() !== startMonth) break;

                    // パターンの位置計算 (オフセット + 経過日数) をパターンの長さで割った余り
                    const shiftIdx = (startOffset + i) % pattern.length;
                    const shiftName = pattern.shifts[shiftIdx];

                    if (shiftName && shiftName.trim() !== '') {
                        const dateStr = targetDate.toISOString().split('T')[0];
                        const event = { 'summary': shiftName, 'start': { 'date': dateStr }, 'end': { 'date': dateStr } };
                        await createCalendarEvent(event);
                        count++;
                    }
                    i++;
                    
                    // 無限ループ防止用の安全策 (100日以上は登録しない)
                    if (i > 100) break;
                }
                showMessage(`${count}件登録しました。`, 'success');
            } catch (err) {
                showMessage('エラーが発生しました。', 'error');
            } finally {
                document.getElementById('execute-btn').disabled = false;
                document.getElementById('execute-btn').innerText = 'カレンダーに書き込む';
            }
        }

        async function createCalendarEvent(event) {
            const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(event)
            });
            if (!response.ok) throw new Error('API Error');
            return await response.json();
        }

        function showMessage(msg, type) {
            const el = document.getElementById('status-message');
            el.innerText = msg;
            el.className = `mt-6 p-4 rounded-lg text-sm font-medium border ${type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 8000);
        }
    </script>
</body>
</html>
